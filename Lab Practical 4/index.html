<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Personal Expense Tracker</span>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Financial Dashboard / Summary Cards -->
        <div class="mb-4">
            <h2>Financial Dashboard</h2>
            <p class="text-muted">Manage your income and expenses in one place.</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Total Income</h6>
                            <h3 id="totalIncome" class="fw-bold text-success">LKR 0.00</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Total Expenses</h6>
                            <h3 id="totalExpense" class="fw-bold text-danger">LKR 0.00</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Current Balance</h6>
                            <h3 id="currentBalance" class="fw-bold text-primary">LKR 0.00</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h4 class="card-title mb-3">Add a Transaction</h4>
                <form id="transactionForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Transaction Type</label>
                            <select id="type" class="form-select" required>
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Description</label>
                            <input type="text" id="description" class="form-control"
                                placeholder="e.g. Monthly allowance" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Amount (LKR)</label>
                            <input type="number" id="amount" class="form-control" placeholder="Enter amount" step="0.01"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select id="category" class="form-select" required>
                                <option value="" disabled selected>Select a category</option>
                                <option value="Allowance">Allowance</option>
                                <option value="Salary">Salary</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Education">Education</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Transaction Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Add Transaction</button>
                        <button type="button" id="clearBtn" class="btn btn-outline-secondary ms-2">Clear Form</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Transaction History & Filters -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h4 class="card-title mb-3">Transaction History</h4>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Filter by Type</label>
                        <select id="filterType" class="form-select">
                            <option value="All">All Transactions</option>
                            <option value="Income">Income Only</option>
                            <option value="Expense">Expense Only</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Search Transactions</label>
                        <input type="text" id="searchBox" class="form-control"
                            placeholder="Search by description or category">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Category</th>
                                <th>Amount (LKR)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted">No transactions found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
